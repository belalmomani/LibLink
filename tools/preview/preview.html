<!doctype html>
<html lang="ar" dir="rtl"><meta charset="utf-8">
<title>معاينة مشاهد الآفاق القرآنية</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
 body{margin:0;background:#02050f;color:#eaf0ff;font-family:serif}
 #wrap{position:relative;width:390px;height:844px;margin:0 auto;overflow:hidden}
 canvas{position:absolute;left:0;top:0;width:390px;height:844px}
 #scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,13,37,.27) 0%,rgba(6,13,37,0) 45%,rgba(6,13,37,.67) 62%,rgba(6,13,37,.87) 100%)}
 #txt{position:absolute;left:16px;right:16px;top:560px;text-align:center;font-size:30px;line-height:54px}
 #ev{position:absolute;left:16px;right:16px;top:520px;text-align:center;font-size:12px;color:#e9cd8e;font-family:sans-serif}
 #bar{position:absolute;left:0;right:0;top:12px;text-align:center;font:15px sans-serif}
 #ctl{padding:10px;text-align:center;font:13px sans-serif}
</style>
<div id="wrap"><canvas id="c" width="780" height="1688"></canvas><div id="scrim"></div>
<div id="bar"></div><div id="ev"></div><div id="txt"></div></div>
<div id="ctl"></div>
<script>
// تنبيه: هذه المعاينة تنفّذ منطق Timeline.kt وSceneRenderer.kt نفسه بـ JavaScript لمراجعة الشكل بصريًا؛
// مواضع العشوائية تختلف قليلًا عن Java Random، والمرجع النهائي هو التطبيق.
const S=2; // ‏مقياس البكسل (780 عرض الكانفاس)
function rng(seed){let s=seed>>>0||1;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const lerp=(a,b,u)=>a+(b-a)*u, smooth=u=>u*u*(3-2*u);
const apply=(b,set)=>{const o={...b};for(const id in set)o[id]={...(o[id]||{}),...set[id]};return o};
const initial=sc=>Object.fromEntries(sc.actors.map(a=>[a.id,{...a.init}]));
function before(sc,ay){let st=initial(sc);for(const b of [...sc.beats].filter(b=>b.ayah<ay).sort((x,y)=>x.ayah-y.ayah))for(const k of [...b.keys].sort((x,y)=>x.t-y.t))st=apply(st,k.set);return st}
function lerpS(a,b,u){const o={};for(const id of new Set([...Object.keys(a),...Object.keys(b)])){const x=a[id]||{},y=b[id]||{};o[id]={};for(const k of new Set([...Object.keys(x),...Object.keys(y)])){const v0=x[k]??y[k]??0,v1=y[k]??x[k]??0;o[id][k]=v0+(v1-v0)*u}}return o}
function resolve(sc,ay,p){const bf=before(sc,ay);const beat=sc.beats.find(b=>b.ayah==ay);if(!beat)return bf;const pts=[[0,bf]];let cur=bf;for(const k of [...beat.keys].sort((x,y)=>x.t-y.t)){cur=apply(cur,k.set);pts.push([Math.min(1,Math.max(0,k.t)),cur])}
 const q=Math.min(1,Math.max(0,p));for(let i=1;i<pts.length;i++){if(q<pts[i][0]){const [t0,s0]=pts[i-1],[t1,s1]=pts[i];const d=t1-t0;const u=d<=0?1:Math.min(1,Math.max(0,(q-t0)/d));return lerpS(s0,s1,smooth(u))}}return pts[pts.length-1][1]}
const ctx=document.getElementById('c').getContext('2d');const W=780,H=1688;
const rgba=(hex,a)=>{const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${Math.max(0,Math.min(1,a))})`};
function radial(x,y,r,col,a){const g=ctx.createRadialGradient(x,y,0,x,y,Math.max(1,r));g.addColorStop(0,rgba(col,a));g.addColorStop(1,rgba(col,0));ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
function env(sp,t){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,sp.skyTop);g.addColorStop(1,sp.skyBottom);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 const r=rng(42);for(let i=0;i<sp.stars;i++){const x=r()*W,y=r()*H*.5,rr=.6*S+r()*1.3*S;r();r();const b=.3+r()*.5;ctx.fillStyle=`rgba(255,255,255,${b})`;ctx.beginPath();ctx.arc(x,y,rr,0,7);ctx.fill()}
 if(sp.glow){const gl=sp.glow;const gr=ctx.createRadialGradient(gl.x*W,gl.y*H,0,gl.x*W,gl.y*H,gl.r*W);gr.addColorStop(0,rgba(gl.color,gl.alpha));gr.addColorStop(1,rgba(gl.color,0));ctx.fillStyle=gr;ctx.fillRect(0,0,W,H)}
 if(sp.mist>0)for(let b=0;b<3;b++){const y0=H*(.40+b*.07);const g2=ctx.createLinearGradient(0,y0,0,y0+H*.12);g2.addColorStop(0,'rgba(255,255,255,0)');g2.addColorStop(.5,`rgba(255,255,255,${sp.mist*.08})`);g2.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g2;ctx.fillRect(0,y0,W,H*.12)}
 sp.ridges.forEach((rd,idx)=>{const base=H*(1-rd.h);ctx.beginPath();ctx.moveTo(0,H);for(let s=0;s<=24;s++){ctx.lineTo(W*s/24,base+Math.sin(s*.9+idx*2)*H*.006+Math.sin(s*.37+idx)*H*.009)}ctx.lineTo(W,H);ctx.closePath();ctx.fillStyle=rd.color;ctx.fill()})}
const SG={top:H*.10,h:H*.44};const px=(nx,ny)=>[nx*W,SG.top+ny*SG.h];
function human(fx,fy,h,a){const bw=h*.30,hr=h*.12,bt=fy-h*.74;ctx.fillStyle=`rgba(5,11,32,${a})`;ctx.strokeStyle=`rgba(217,168,79,${.55*a})`;ctx.lineWidth=1.4*S;
 ctx.beginPath();ctx.roundRect(fx-bw/2,bt,bw,h*.74,bw*.45);ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(fx,bt-hr*.9,hr,0,7);ctx.fill();ctx.stroke()}
const IMGS={};
const A={
 image(a,st,m){const al=(st.a||0)*m;if(al<=.01||!IMGS[a.id])return;const im=IMGS[a.id];const z=Math.min(1,Math.max(0,st.z||0));const k=1+.04*z;const dw=W*k,dh=W*im.height/im.width*k,top=H*.07;ctx.globalAlpha=al;ctx.drawImage(im,(W-dw)/2,top-(dh-W*im.height/im.width)/2,dw,dh);ctx.globalAlpha=1},
 crowd(a,st,m){const al=(st.a||0)*m;if(al<=.01)return;const g=st.gather||0,rw=st.rows||0,bd=Math.min(1,Math.max(0,st.bind||0));const r=rng(a.seed);const pts=[];for(let i=0;i<a.n;i++){const sx=.08+r()*.84,sy=.62+r()*.36;const row=Math.floor(i/7),col=i%7;const gx=.5+(col-3)*.047+(row%2)*.02,gy=.97-.075*row,rx=.5+(col-3)*.125,ry=.97-.085*row;pts.push([lerp(lerp(sx,gx,g),rx,rw),lerp(lerp(sy,gy,g),ry,rw)])}
  pts.sort((p,q)=>p[1]-q[1]);
  if(bd>.02){const [ax,ay]=px(.5,-.35);for(const p of pts){const [fx,fy]=px(p[0],p[1]);const hx=fx,hy=fy-SG.h*.34*.56*(.7+.3*p[1])*.95;const ex=lerp(ax,hx,bd),ey=lerp(ay,hy,bd);ctx.strokeStyle=`rgba(243,217,143,${.45*al})`;ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(ex,ey);ctx.stroke();if(bd>.95){ctx.fillStyle=`rgba(255,241,194,${.9*al})`;ctx.beginPath();ctx.arc(hx,hy,W*.007,0,7);ctx.fill()}}}
  for(const p of pts){const [fx,fy]=px(p[0],p[1]);human(fx,fy,SG.h*.34*.56*(.7+.3*p[1]),al)}},
 shade(a,st,m,t){const al=(st.a||0)*m,r=Math.min(1,Math.max(0,st.r||0));if(al<=.01)return;for(const side of [-1,1])for(let k=0;k<4;k++){const edge=side<0?-.12:1.12;const nx=lerp(edge,.5,r*.72)+Math.sin(t*.8+k*1.7+side)*.012,ny=.58+k*.1;const [cx,cy]=px(nx,ny);radial(cx,cy,W*(.15+.02*Math.sin(t+k)),'#5A1F44',.85*al)}},
 dimlights(a,st,m){const al=(st.a||0)*m;if(al<=.01)return;const n=Math.max(2,a.n);for(let i=0;i<n;i++){const [cx,cy]=px(.08+.84*i/(n-1),.64+.06*Math.sin(i*2.1));radial(cx,cy,W*.04,'#B4C2E8',.5*al);ctx.fillStyle=`rgba(216,224,245,${.7*al})`;ctx.beginPath();ctx.arc(cx,cy,W*.005,0,7);ctx.fill()}},
 figure(a,st,m,t){const al=(st.a||0)*m;if(al<=.01)return;const [fx,fy]=px(a.x,a.y);const h=SG.h*.34*a.s;human(fx,fy,h,al);const ch=st.chest||0;if(ch>.02){const cy=fy-h*.45,sp=h*.11;for(let i=0;i<8;i++){const ph=i*1.7;ctx.fillStyle=`rgba(143,107,232,${Math.min(1,.9*ch*al)})`;ctx.beginPath();ctx.arc(fx+Math.sin(t*1.3+ph)*sp,cy+Math.cos(t*1.1+ph*1.3)*sp*1.6,h*.04,0,7);ctx.fill()}}},
 lantern(a,st,m,t){const al=(st.a||0)*m;if(al<=.01)return;const g=Math.min(1,Math.max(0,st.g||0));const [cx,cy]=px(a.x,a.y);radial(cx,cy,W*(.06+.26*g),'#FFE9A8',(.35+.5*g)*al);ctx.fillStyle=`rgba(255,243,200,${al})`;ctx.beginPath();ctx.arc(cx,cy,W*.013,0,7);ctx.fill()},
 dome(a,st,m){const al=(st.a||0)*m,d=Math.min(1,Math.max(0,st.draw||0));if(al<=.01||d<=.01)return;const [cx,cy]=px(a.x,a.y);const rx=W*.42*a.s,ry=SG.h*.88*a.s;const end=Math.PI+Math.PI*d;
  ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,Math.PI,end);ctx.lineTo(cx,cy);ctx.fillStyle=`rgba(217,168,79,${.06*al*d})`;ctx.fill();
  ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,Math.PI,end);ctx.strokeStyle=`rgba(233,205,142,${.16*al})`;ctx.lineWidth=16;ctx.stroke();ctx.strokeStyle=`rgba(243,217,143,${.9*al})`;ctx.lineWidth=3.2;ctx.stroke()},
 starOrder(a,st,m,t){const al=(st.a||0)*m;if(al<=.01)return;const od=Math.min(1,Math.max(0,st.order||0));const r=rng(a.seed);const counts=[8,14,18],radii=[.13,.25,.37];const cx=W*.5,cy=SG.top+SG.h*.30;let idx=0;
  for(let ring=0;ring<3;ring++)for(let j=0;j<counts[ring];j++){const scx=W*(.05+r()*.9),scy=SG.top+SG.h*(.02+r()*.5);const ang=2*Math.PI*j/counts[ring]+ring*.4;const ox=cx+Math.cos(ang)*radii[ring]*W,oy=cy+Math.sin(ang)*radii[ring]*W*.62;const x=lerp(scx,ox,od),y=lerp(scy,oy,od);const tw=.85+.15*Math.sin(t*1.2+idx);radial(x,y,W*.03,'#FFF1C2',.55*al*tw);ctx.fillStyle=`rgba(255,248,221,${al*tw})`;ctx.beginPath();ctx.arc(x,y,W*.006,0,7);ctx.fill();idx++}
  if(od>.02)for(let ring=0;ring<3;ring++){ctx.beginPath();ctx.ellipse(cx,cy,radii[ring]*W,radii[ring]*W*.62,0,0,7);ctx.strokeStyle=`rgba(233,205,142,${.22*od*al})`;ctx.lineWidth=1.4;ctx.stroke()}},
 beam(a,st,m){const al=(st.a||0)*m,hh=Math.min(1,Math.max(0,st.h||0));if(al<=.01)return;const [bx,by]=px(a.x,.74);radial(bx,by,W*.16,'#FFE9A8',.55*al);if(hh<=.01)return;const hgt=SG.h*.74*hh,top=by-hgt,bw=W*.07;
  let g=ctx.createLinearGradient(0,top,0,by);g.addColorStop(0,'rgba(255,233,168,0)');g.addColorStop(1,`rgba(255,233,168,${.75*al})`);ctx.fillStyle=g;ctx.fillRect(bx-bw/2,top,bw,hgt);
  g=ctx.createLinearGradient(0,top,0,by);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(1,`rgba(255,255,255,${.85*al})`);ctx.fillStyle=g;ctx.fillRect(bx-bw*.15,top,bw*.3,hgt)},
 wisps(a,st,m,t){const al=(st.a||0)*m,r=Math.min(1,Math.max(0,st.r||0));if(al<=.01)return;const [sx,sy]=px(a.sx,a.sy),[ex,ey]=px(a.tx,a.ty);const dx=ex-sx,dy=ey-sy,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len;const n=Math.max(1,a.n);
  for(let i=0;i<n;i++){const f=r*(i+1)/n,wob=Math.sin(t*2+i*1.3)*W*.018*(.4+r);const cx=sx+dx*f+nx*wob,cy=sy+dy*f+ny*wob;const rad=W*(.012+.02*Math.sin(Math.PI*(i+1)/(n+1)))*(.45+.55*r);radial(cx,cy,rad*2.2,'#8A68E0',.8*al)}},
 smoke(a,st,m,t){const al=(st.a||0)*m;if(al<=.01)return;const [x0,y0]=px(a.x,a.y);for(let i=0;i<7;i++){const x=x0+Math.sin(t*.5+i*1.9)*W*.05,y=y0+Math.cos(t*.4+i*1.3)*W*.06;radial(x,y,W*(.075+.02*Math.sin(i+t*.3)),'#6B58B0',.5*al)}}
};
function frame(sc,state,t){env(sc.env,t);for(const a of sc.actors){const st=state[a.id];if(st&&A[a.kind])A[a.kind](a,st,1,t)}
 let bottom=0;for(const a of sc.actors)if(a.kind=='image'&&IMGS[a.id]&&(state[a.id]?.a||0)>.01)bottom=Math.max(bottom,H*.07+W*IMGS[a.id].height/IMGS[a.id].width);
 if(bottom>0){const bg=sc.env.skyBottom;const g=ctx.createLinearGradient(0,bottom-H*.10,0,bottom);g.addColorStop(0,rgba(bg,0));g.addColorStop(1,rgba(bg,1));ctx.fillStyle=g;ctx.fillRect(0,bottom-H*.10,W,H*.10+1);ctx.fillStyle=bg;ctx.fillRect(0,bottom,W,H-bottom)}}
function loadImg(u){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=u})}
async function main(){
 const mod=await (await fetch('../../content/bootstrap/modules/114/module.json')).json();
 const scn=(await (await fetch('../../content/bootstrap/modules/114/scenes.json')).json()).scenes;
 const q=new URLSearchParams(location.search);const ay=+(q.get('ayah')||1),p=+(q.get('p')||1);
 const a=mod.ayahs.find(x=>x.number==ay);const sc=scn.find(s=>s.id==a.sceneId);
 for(const a of sc.actors)if(a.kind=='image')IMGS[a.id]=await loadImg('../../content/bootstrap/'+a.file);
 frame(sc,resolve(sc,ay,p),p*9);
 const beat=sc.beats.find(b=>b.ayah==ay);
 document.getElementById('bar').textContent=`سورة ${mod.nameAr} — ${ay}/${mod.ayahs.length}`;
 document.getElementById('ev').textContent=beat.visualEvent;
 document.getElementById('txt').textContent=(ay==1&&mod.basmala?mod.basmala+' ':'')+a.text;
 document.getElementById('ctl').textContent=`آية ${ay} — تقدّم ${p}`;
 document.title='ready';
}
main();
</script>
</html>
